        const map = L.map('map').setView([-3.7585, 102.2745], 16);

        function inisialisasiDatalistPeta() {
            const dl = document.getElementById('lokasiList');
            dl.innerHTML = "";

        }

        Object.keys(nodes).forEach(name => {
            let isGedung = !name.startsWith("Simpang") && !name.startsWith("Jalan") && !name.startsWith("Jembatan");

            let markerRadius = isGedung ? 6 : 4;
            if (name.includes("Gerbang")) { markerColor = "#a99702"; markerRadius = 7; }
            L.circleMarker(nodes[name], { radius: markerRadius, fillColor: markerColor, color: "#f8fafc", weight: 1.5, fillOpacity: 0.85 }).addTo(map).bindPopup(`<b>${name}</b>`);
        });

        inisialisasiDatalistPeta();
        let routeLayer = null;

        // JALUR / EDGES

                "Jalan Depan GSG": { "GSG": 60, "Simpang Dekanat Teknik dan Gerbang Keluar": 20, "Simpang Sekre Teknik dan Laboratorium": 20, "Gedung Dekanat Teknik": 25 },

        // IMPLEMENTASI ALGORITMA DIJKSTRA 
        function dijkstra(graf, start, end) {
            let distances = {}; let prev = {}; let pq = [];
            Object.keys(nodes).forEach(node => { distances[node] = Infinity; prev[node] = null; });
            distances[start] = 0;
            pq.push({ node: start, dist: 0 });

            while (pq.length > 0) {
                pq.sort((a, b) => a.dist - b.dist);
                let current = pq.shift(); let u = current.node;
                if (u === end) break;
                if (graf[u]) {
                    Object.keys(graf[u]).forEach(neighbor => {
                        let alt = distances[u] + graf[u][neighbor];
                        if (alt < distances[neighbor]) { distances[neighbor] = alt; prev[neighbor] = u; pq.push({ node: neighbor, dist: alt }); }
                    });
                }
            }
            let path = []; let u = end;
            if (prev[u] || u === start) { while (u) { path.unshift(u); u = prev[u]; } }
            return { path: path, distance: distances[end] };
        }

        // PROSES NAVIGASI UTAMA 
        function prosesPencarianJalur() {
            const start = document.getElementById('startNode').value.trim();
            const end = document.getElementById('endNode').value.trim();
            const hari = document.getElementById('inputHari').value;
            const timeVal = document.getElementById('inputTime').value;
            const jam = parseInt(timeVal.split(':')[0]);

            const sidePanel = document.getElementById('sidePanel');
            const infoBox = document.getElementById('hasilInfo');

            if (!nodes[start] || !nodes[end]) { alert("Nama tempat salah atau tidak terdaftar!"); return; }

            const grafSekarang = buatGrafDinamis(hari, jam);
            const hasilFinal = dijkstra(grafSekarang, start, end);

            if (routeLayer) map.removeLayer(routeLayer);

            sidePanel.classList.remove('hidden');
            sidePanel.classList.add('flex');

            if (hasilFinal.path.length === 0 || hasilFinal.distance === Infinity) {
                infoBox.innerHTML = `<div class="text-red-700 font-bold">❌ Jalur Buntu!</div>
                                     <div class="text-xs text-slate-500 mt-1">Tidak ditemukan akses lintasan karena terhalang aturan satu arah atau gerbang tutup.</div>`;
                setTimeout(() => { map.invalidateSize(); }, 100);
                return;
            }

            infoBox.innerHTML = `
                <div>
                    <span class="text-xs uppercase font-semibold tracking-wider text-slate-400 block">Jarak Terpendek</span>
                    <span class="text-2xl font-black text-[#11206a]">±${hasilFinal.distance} <span class="text-sm font-normal text-slate-500">meter</span></span>
                </div>
                <div class="border-t pt-3 flex flex-col overflow-hidden flex-grow">
                    <span class="text-xs uppercase font-semibold tracking-wider text-slate-400 block mb-2">Rute Langkah</span>
                    <div class="flex flex-col gap-1.5 text-xs text-slate-700 font-medium overflow-y-auto pr-1">
                        ${hasilFinal.path.map((step, idx) => `
                            <div class="flex items-start gap-2 p-2 rounded bg-slate-50 border border-slate-100">
                                <span class="bg-[#11206a] text-white font-bold rounded h-5 w-5 flex items-center justify-center shrink-0 text-[10px]">${idx + 1}</span>
                                <span class="pt-0.5">${step}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>`;

            setTimeout(() => { map.invalidateSize(); }, 100);

            const pointJalur = hasilFinal.path.map(namaNode => nodes[namaNode]);
            routeLayer = L.polyline(pointJalur, { color: '#11206a', weight: 6, opacity: 0.9, lineCap: 'round', lineJoin: 'round' }).addTo(map);
            map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });
        }
    </script>
